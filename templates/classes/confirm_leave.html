{% extends 'base.html' %}

{% block title %}退出班級 - APCS 練習平台{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-danger">
                <div class="card-header bg-danger text-white">
                    <h5 class="mb-0"><i class="bi bi-exclamation-triangle me-2"></i>確認退出班級</h5>
                </div>
                <div class="card-body p-4 text-center">
                    <p class="lead">確定要退出班級「{{ classroom.name }}」嗎？</p>
                    <div class="d-flex gap-2 justify-content-center mt-4">
                        <form method="post">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-danger">確認退出</button>
                        </form>
                        <a href="{% url 'classes:detail' classroom.pk %}" class="btn btn-outline-secondary">取消</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
