{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}加入班級 - APCS 練習平台{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-header bg-warning text-dark text-center py-3">
                    <h4 class="mb-0"><i class="bi bi-people me-2"></i>加入班級</h4>
                </div>
                <div class="card-body p-4">
                    <p class="text-muted text-center mb-4">請輸入教師提供的班級代號（例如 CLASS01）</p>
                    <form method="post">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <div class="d-grid mt-3">
                            <button type="submit" class="btn btn-warning btn-lg">
                                <i class="bi bi-arrow-right-circle me-2"></i>加入班級
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
