{% extends 'base.html' %}

{% block title %}重設連結已寄出 - APCS 練習平台{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-body p-4 text-center">
                    <i class="bi bi-envelope-check text-success" style="font-size: 3rem;"></i>
                    <h4 class="mt-3">重設連結已寄出</h4>
                    <p class="text-muted mb-0">
                        如果該電子郵件有對應的帳號，我們已經將密碼重設連結寄過去了。
                        請至信箱查收（也請檢查垃圾郵件匣），連結效期有限，請盡快使用。
                    </p>
                </div>
                <div class="card-footer text-center py-3">
                    <a href="{% url 'accounts:login' %}"><i class="bi bi-arrow-left me-1"></i>回到登入頁</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
