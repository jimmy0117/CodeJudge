{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}忘記密碼 - APCS 練習平台{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white text-center py-3">
                    <h4 class="mb-0"><i class="bi bi-key me-2"></i>忘記密碼</h4>
                </div>
                <div class="card-body p-4">
                    <p class="text-muted">請輸入註冊時使用的電子郵件，我們會寄送重設密碼的連結給你。</p>
                    <form method="post">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <div class="d-grid mt-3">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="bi bi-send me-2"></i>寄送重設連結
                            </button>
                        </div>
                    </form>
                </div>
                <div class="card-footer text-center py-3">
                    <a href="{% url 'accounts:login' %}"><i class="bi bi-arrow-left me-1"></i>回到登入頁</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
