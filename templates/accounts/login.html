{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}登入 - APCS 練習平台{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white text-center py-3">
                    <h4 class="mb-0"><i class="bi bi-box-arrow-in-right me-2"></i>登入</h4>
                </div>
                <div class="card-body p-4">
                    <form method="post">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <div class="d-grid mt-3">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="bi bi-box-arrow-in-right me-2"></i>登入
                            </button>
                        </div>
                    </form>

                    <!-- 分隔線 -->
                    <div class="position-relative text-center my-4">
                        <hr class="my-0">
                        <span class="position-absolute top-50 start-50 translate-middle bg-white px-3 text-muted small">
                            或
                        </span>
                    </div>

                    <!-- Google 登入 -->
                    <div class="d-grid">
                        <a href="{% url 'social:begin' 'google-oauth2' %}"
                           class="btn btn-outline-secondary btn-lg d-flex align-items-center justify-content-center gap-2">
                            <svg width="20" height="20" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                            </svg>
                            使用 Google 帳號登入
                        </a>
                    </div>
                </div>
                <div class="card-footer text-center py-3">
                    <span class="text-muted">還沒有帳號？</span>
                    <a href="{% url 'accounts:register' %}" class="ms-1">立即註冊</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
