{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}開始練習 - APCS 練習平台{% endblock %}

{% block content %}
<div class="container py-4">
    <h2 class="fw-bold mb-4"><i class="bi bi-pencil-square me-2"></i>選擇練習模式</h2>

    <div class="row g-4">
        <!-- Quick Mode Cards -->
        <div class="col-lg-8">
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <div class="card h-100 shadow-sm border-primary">
                        <div class="card-body text-center p-4">
                            <i class="bi bi-shuffle display-4 text-primary mb-3"></i>
                            <h5>隨機練習</h5>
                            <p class="text-muted small">從題庫中隨機抽取題目，全面練習</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card h-100 shadow-sm border-danger">
                        <div class="card-body text-center p-4">
                            <i class="bi bi-x-circle display-4 text-danger mb-3"></i>
                            <h5>錯題複習</h5>
                            <p class="text-muted small">針對答錯的題目進行間隔複習</p>
                            <a href="{% url 'practice:wrong_list' %}" class="btn btn-outline-danger btn-sm">查看錯題</a>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card h-100 shadow-sm border-warning">
                        <div class="card-body text-center p-4">
                            <i class="bi bi-star display-4 text-warning mb-3"></i>
                            <h5>收藏練習</h5>
                            <p class="text-muted small">練習你收藏的題目</p>
                            <a href="{% url 'practice:favorites' %}" class="btn btn-outline-warning btn-sm">查看收藏</a>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card h-100 shadow-sm border-info">
                        <div class="card-body text-center p-4">
                            <i class="bi bi-graph-down display-4 text-info mb-3"></i>
                            <h5>弱點練習</h5>
                            <p class="text-muted small">針對正確率最低的分類加強練習</p>
                            <a href="{% url 'dashboard:weakness' %}" class="btn btn-outline-info btn-sm">查看弱點</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Custom Form -->
        <div class="col-lg-4">
            <div class="card shadow-sm">
                <div class="card-header bg-light">
                    <h5 class="mb-0"><i class="bi bi-sliders me-2"></i>自訂練習</h5>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <div class="d-grid mt-3">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-play-fill me-2"></i>開始練習
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
